<body>

	<!-- Lucide icons (lucide.dev, ISC license, lucide-static 1.75.0): circle-help, hard-drive-download,
	     settings, calendar-days, rotate-cw, lightbulb, pause, download, upload, file-text, x, check, triangle-alert,
	     share, chevron-down -->

	<symbol id="i-gear" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></symbol>
	<symbol id="i-cal" viewBox="0 0 24 24"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/></symbol>

	<symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></symbol>

<div class="app" id="app">
	<header class="hdr">
		<div class="name"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="6"/><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="18" x2="6" y2="18"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><circle cx="6" cy="18" r="3"/></svg></span><h1>wortnetz</h1><small id="day"></small></div>
		<button class="btn skip" type="button" id="bSkip" hidden>Überspringen</button>
		<button class="ib" type="button" data-open="help" aria-label="So geht's" title="So geht's"><svg class="i" aria-hidden="true"><use href="#i-help"/></svg></button>
		<button class="ib" type="button" data-open="settings" aria-label="Einstellungen" title="Einstellungen"><svg class="i" aria-hidden="true"><use href="#i-gear"/></svg></button>
	</header>
	<div class="gbar" id="gbar">
		<button class="ib" type="button" data-open="archive" aria-label="Archiv" title="Archiv"><svg class="i" aria-hidden="true"><use href="#i-cal"/></svg></button>
		<button class="clock" type="button" id="clock" aria-label="Pause" title="Pause"><span id="ctime">0:00</span><svg class="i pz" aria-hidden="true"><use href="#i-pause"/></svg></button>
		<button class="ib" type="button" id="bRotate" aria-label="Brett drehen" title="Brett drehen"><svg class="i" aria-hidden="true"><use href="#i-rot"/></svg></button>
		<button class="ib" type="button" id="bHint" aria-label="Tipp" title="Tipp"><svg class="i" aria-hidden="true"><use href="#i-bulb"/></svg><span class="badge" id="hintN">3</span></button>
	</div>
	<main id="play">
		<div class="wordbar"><div class="word" id="word"></div><div class="msg" id="msg"></div></div>
		<div class="boardwrap"><svg class="board" id="board" viewBox="0 0 400 400" role="img" aria-label="Spielbrett"></svg><button class="pausecard" type="button" id="pausecard"><b>Pause</b><span>Tippen zum Weiterspielen</span></button></div>
		<div class="status"><div class="left" id="left"></div><div class="chips" id="chips"></div></div>
	</main>
	<main id="over" hidden>
		<div class="card"><h2>Alle Rätsel gespielt</h2><p>Neue Rätsel kommen mit dem nächsten Update von wortnetz. Bis dahin kannst du frühere Tage im Archiv spielen.</p></div>
		<div class="btns"><button class="btn pri" type="button" data-open="archive">Archiv</button></div>
	</main>
	<main id="intro" hidden></main>
	<main id="end" hidden>
		<div class="hero"><div class="s" id="eTitle">Gelöst in</div><div class="t" id="eTime"></div></div>
		<div class="tiles" id="eTiles"></div>
		<div class="wl c" id="eFound"></div>
		<div class="btns"><button class="btn" type="button" data-open="archive">Archiv</button><button class="btn pri" type="button" id="bNext">Nächstes</button></div>
		<p class="note c" id="eSoon" hidden></p>
		<button class="dtog" type="button" id="bDetails" aria-expanded="false" aria-controls="eDet">Details<svg class="i" aria-hidden="true"><use href="#i-chev"/></svg></button>
		<div class="det" id="eDet" hidden>
			<div class="hero"><div class="s" id="eCmp"></div></div>
			<section>
				<div class="row"><h3 id="eWordsH">Deine Wörter und Zeiten</h3><div class="seg" id="eView"><button type="button" data-v="table">Tabelle</button><button type="button" data-v="time">Zeitstrahl</button></div></div>
				<div id="eWords"></div>
			</section>
			<section id="eBonus"></section>
			<div class="tiles" id="eStats"></div>
			<div class="btns"><button class="btn" type="button" id="bAgain">Von vorn</button></div>
			<p class="note" id="eNote"></p>
		</div>
	</main>
	<footer class="foot ver" id="foot"></footer>
</div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<input id="fImport" type="file" accept=".json,application/json" hidden>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
